<!-- 錯誤提示條的樣式內嵌在這裡：就算 style.css 載不到，提示條也看得見 -->
<style>#err{display:none;background:#b00020;color:#fff;padding:8px 12px;font-size:13px;word-break:break-all}</style>
<script>
/* 必須最先執行：錯誤提示條（#err）與載入失敗偵測。
   - 執行期錯誤：顯示「页面出错：訊息 (檔名:行號)」。
   - 開發版 dev.html 用一般 <script src> 依序載入（不用 module）：js 檔載入失敗 → 記進 FIT_LOAD_FAILED，
     app.js 看到就不啟動，並顯示「页面文件加载失败」；style.css 載入失敗 → 只顯示提示，問答照常可用。
   - 正式版 index.html 已把所有檔案內嵌，不會有載入失敗，這段只負責顯示執行期錯誤。 */
var FIT_LOAD_FAILED = [], fitErrMsg = '';
function fitShowErr(msg){
  fitErrMsg = msg;
  var b=document.getElementById('err'); if(!b) return;   // #err 還沒解析到：等 DOMContentLoaded 再顯示
  b.style.display='block'; b.textContent=msg;
}
document.addEventListener('DOMContentLoaded',function(){ if(fitErrMsg) fitShowErr(fitErrMsg) });
function fitLoadFail(node){
  var u=(node.getAttribute('src')||node.getAttribute('href')||'').split('?')[0];
  if(node.tagName==='SCRIPT') FIT_LOAD_FAILED.push(u);
  fitShowErr('页面文件加载失败（'+u+'），请检查网络后刷新页面。');
}
window.addEventListener('error',function(e){
  if(FIT_LOAD_FAILED.length) return;  // 已有載入失敗提示時，後續連帶的錯誤不覆蓋它
  var f=(e.filename||'').split('?')[0].split('/').pop();
  fitShowErr('页面出错：'+(e.message||'未知')+' ('+(f?f+':':'')+(e.lineno||'?')+')');
});
</script>
<style>
/* ==== src/style.css ==== */
/* 健身小助手樣式。
   相容性：老版微信 X5/XWeb（Chromium 約 55–100）。不要用 :has()、dvh；版面靠頁面自然捲動，不要改成固定高度。
   已知：flex 的 gap 在 Chromium 84 以前無效（只影響間距）。
   設計：暖灰白底 + 深墨文字 + 單一珊瑚色強調。強調色只用在三處：主按鈕、最重要的一個數字（每日建議摄入）、頂部問答進度線。
   間距落在 4px 格線上；字重只有 400 / 500；圓角依元件大小（按鈕 8、卡片/泡泡 16）。 */
:root{
  --bg:#f7f4ee;--card:#fdfbf7;--raise:#efe9df;
  --ink:#1f1b16;--sub:#5e554a;--mut:#7b7266;
  --line:rgba(31,27,22,.1);--tick:rgba(31,27,22,.3);
  --acc:#c2492f;
  --warn:#7a5412;--warnbg:#f6eedb;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:22px;font-variant-numeric:tabular-nums}
b,strong{font-weight:500}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* 頁首：只有名稱，底部一條問答進度線 */
header{position:sticky;top:0;z-index:5;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header b{display:block;font-size:16px;line-height:24px}
header small{display:block;color:var(--mut);font-size:12px;line-height:16px}
#prog{position:absolute;left:0;right:0;bottom:-1px;height:2px}
#prog i{display:block;width:0;height:2px;background:var(--acc);transition:width .4s var(--ease)}

/* 對話 */
#chat{padding:16px 16px 48px}
.row{display:flex;margin:12px 0;animation:in .3s var(--ease)}
.row.user{justify-content:flex-end}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bub{max-width:85%;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;word-break:break-word}
.user .bub{background:var(--ink);border-color:var(--ink);color:var(--bg);border-radius:16px 4px 16px 16px}
.bub.wide{max-width:100%;width:100%}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;background:var(--tick);border-radius:50%;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-4px)}}

/* 回答區 */
#tray{margin-top:16px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px}
#tray:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:10px 16px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-family:inherit;font-size:15px;line-height:22px;cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.chip:active{background:var(--raise);transform:scale(.98)}
.chip:focus-visible,.mini:focus-visible,.vlink a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.go{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.chip.ghost{background:transparent;color:var(--sub)}
/* 有說明的選項：整列可點，標題 + 一行說明（不用 gap，老版微信也有間距） */
.opts{display:block}
.opt{display:block;width:100%;text-align:left;padding:12px 16px}
.opt+.opt{margin-top:8px}
.opt b{display:block;line-height:22px}
.opt small{display:block;margin-top:2px;color:var(--mut);font-size:13px;line-height:20px}
.opts .back{margin-top:8px;width:auto}
.ogrp{margin:16px 0 8px;font-size:12px;line-height:16px;color:var(--mut)}
.ogrp:first-child{margin-top:0}
.rec{display:inline-block;margin-left:8px;padding:0 4px;border:1px solid var(--line);border-radius:4px;color:var(--mut);font-size:11px;line-height:16px;font-weight:400;vertical-align:1px}
.chip.ok0{flex:1;background:var(--card);border-color:var(--ink);color:var(--ink)}
.sact .back{order:-1}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.on small{color:rgba(247,244,238,.75)}
.opts .go{display:block;width:100%;margin-top:8px}
.chip:disabled{opacity:.6;cursor:default}

/* 身體數據卡：每行 = 名稱 | −5 −1 | 數字（點一下確認，底下是刻度尺） | +1 +5 */
.nrow{display:flex;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nlab{flex:none;width:44px;font-size:14px;line-height:18px;color:var(--sub)}
.nlab small{display:block;font-size:11px;line-height:14px;color:var(--mut)}
.nbtn{flex:none;width:36px;min-height:40px;margin-left:4px;padding:0;text-align:center;font-size:13px}
.nval{flex:1;min-width:0;margin:0 0 0 4px;min-height:40px;padding:0 0 10px;border:0;border-radius:0;background-color:transparent;font-family:inherit;font-size:16px;line-height:30px;color:var(--mut);
  background-image:linear-gradient(90deg,var(--tick) 1px,transparent 1px),linear-gradient(90deg,var(--tick) 1px,transparent 1px);
  background-size:8px 5px,40px 9px;background-repeat:repeat-x;background-position:var(--off,0) 100%,var(--off,0) 100%}
.nval.on{color:var(--ink);font-weight:500}
.nbox .sact{margin-top:12px}

/* 底部按鈕列（身體數據卡的「確定」「改上一題」） */
.sact{display:flex;gap:8px;margin-top:16px}
.sact .go{flex:1}

/* 卡片 */
.card h3{margin:0 0 8px;font-size:17px;line-height:24px;font-weight:500}
.muted{color:var(--mut);font-size:13px;line-height:20px}
.warn{margin:12px 0;padding:12px;background:var(--warnbg);border-radius:8px;color:var(--warn);font-size:14px;line-height:20px}

/* 結果頁：一個大數字 + 三大營養素比例條，其餘是安靜的列表 */
.sum h3{margin:0;font-size:13px;line-height:20px;color:var(--mut)}
.big{margin:4px 0;line-height:56px}
.big b{font-size:52px;letter-spacing:-.02em;color:var(--acc)}
.big span{margin-left:4px;font-size:16px;color:var(--mut)}
.mbar{display:flex;height:8px;margin:16px 0 8px;border-radius:4px;overflow:hidden;background:var(--raise)}
.mbar i{display:block;height:100%}
.m1{background:var(--acc)}.m2{background:var(--sub)}.m3{background:#cfc6b6}
.mleg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;line-height:20px;color:var(--sub)}
.mleg s{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:2px;text-decoration:none}
.mleg b{color:var(--ink)}
.rows{margin:16px 0 8px}
.rows div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.rows span{color:var(--sub)}

/* 訓練計劃：一週條（實心＝訓練日，外框＝有氧日） */
.week{display:flex;margin:12px 0 4px}
.wd{flex:1;margin:0 2px;padding:8px 0;border:1px solid var(--line);border-radius:8px;text-align:center;font-size:12px;line-height:16px;color:var(--mut)}
.wd:first-child{margin-left:0}.wd:last-child{margin-right:0}
.wd::after{content:attr(data-d)}
.wd.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wd.cd{border-color:var(--ink);color:var(--ink)}
.day{padding:12px 0;border-top:1px solid var(--line)}
.day h4{margin:0 0 8px;font-size:15px;line-height:22px;font-weight:500}
.day h4 span{display:inline-block;min-width:40px;margin-right:8px;font-weight:400;color:var(--mut)}
.day ol{margin:0;padding-left:20px}
.day li{margin:4px 0}
.day li i{color:var(--mut);font-style:normal;font-size:13px}
.meal{padding:8px 0}
.meal small{color:var(--sub);font-size:13px}

/* 動作說明 */
.exr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exb{flex:none}
.mini{padding:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--sub);font-family:inherit;font-size:12px;line-height:16px;transition:background-color .15s var(--ease)}
.mini:active{background:var(--raise)}
.xd{margin:4px 0}
.xd summary{color:var(--sub);font-size:13px;cursor:pointer}
.xb{margin-top:8px;padding:12px;background:var(--raise);border-radius:8px;font-size:14px;line-height:22px}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.imgs img{max-width:100%;max-height:230px;height:auto;border-radius:4px;background:#fff}
.vlink{margin:8px 0 4px}
.vlink a{display:inline-block;padding:4px 12px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:13px;line-height:20px;text-decoration:none}
ul.t{margin:8px 0;padding-left:20px}
ul.t li{margin:4px 0}

/* 可展開的每日菜單、食物分類 */
.dd{padding:12px 0;border-top:1px solid var(--line)}
.dd summary{padding:0;font-weight:500;cursor:pointer;list-style:none}
.dd summary::after{content:"＋";float:right;color:var(--mut)}
.dd[open] summary::after{content:"－"}
.dd summary::-webkit-details-marker{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

   以下 wger 來源與授權說明為原版註解，原樣保留。 */

   - 別名：同一個 wger 動作在訓練模板裡用了另一個名字（例如 home 模板寫「哑铃高脚杯深蹲」）。
     logic.js 會在原動作後面緊接著複製一行、只換名稱，所以 EXI 順序與舊版完全相同。
   - 順序有意義：換動作、重點加練、動作庫列表都依這個順序，不要重新排序。 */
const EXERCISE_ROWS = [
// 深蹲类 sq
 ['高脚杯深蹲','sq',1,'k','股四头肌、臀肌','哑铃','双手抱住哑铃贴近胸前，双脚与肩同宽、膝盖微屈。下蹲到大腿与地面平行，保持背部挺直，髋部向后，膝盖对准脚尖。重心放在脚跟，目视前方或略上方。',203,'ataraxie67','CC-BY-SA 4.0','哑铃高脚杯深蹲'],

 ['相扑深蹲','sq',0,'k','臀肌、股四头肌','徒手','双脚比肩宽，脚尖外开约 45°。保持背部挺直，屈膝屈髋缓慢下蹲，像要坐下去，下到大腿与地面平行，再蹬地站起。',632,'sophialj','CC-BY-SA 4.0'],
 ['抱头深蹲','sq',0,'k','臀肌、股四头肌','徒手','双脚与髋同宽、脚尖朝前，挺胸，双手放在脑后、手指轻扣、肘朝两侧。髋部向后推、屈膝，上身尽量保持直立。膝盖向外推，不能向内扣。',1208,'lxmx','CC-BY-SA 4.0'],
 ['慢速深蹲','sq',0,'k','股四头肌、臀肌','徒手','用节奏控制来增加肌肉张力：3 秒慢慢下蹲，在底部停 1 秒，再用正常速度站起。挺胸，重心放在脚跟。',1963,'Anon#2','CC-BY-SA 4.0'],
 ['靠墙静蹲','sq',0,'k','大腿前后侧','徒手','背靠平整的墙，慢慢下滑并让双脚离墙，直到大腿与地面平行、膝和髋大约成 90°。双臂交叉放胸前，保持 30 秒。',718,'Blablabla','CC0'],
 ['腿举','sq',2,'k','股四头肌','腿举器械','腿举是用双腿把重量推离身体的负重训练。',371,'BFad07','CC0'],

 ['哑铃保加利亚分腿蹲','lg',1,'k','臀肌、股四头肌','哑铃、长凳','后脚踩在高处（如长凳），用前腿做单腿下蹲。抬高后腿会增加不稳定性和动作幅度。',1706,'AlucardEvil40','CC-BY-SA 4.0'],
 ['上台阶','lg',0,'k','臀肌、股四头肌','椅子','面对椅子站立，踏上椅子，再退下来，重复。',981,'','CC-BY-SA 4.0'],
// 臀部与髋 gl
 ['臀桥','gl',0,'','臀肌','徒手','仰卧，屈髋屈膝，双脚踩地。抬起臀部，让肩、髋、膝成一条直线。想加大强度，可以把脚垫高到台阶或长凳上。',265,'tdprice12','CC-BY-SA 4.0'],
 ['单腿臀桥','gl',0,'','臀肌','徒手','摆好臀桥姿势，用脚跟支撑，交替把一条腿伸直。全程让髋部尽量保持伸展。',1906,'cybro','CC-BY-SA 4.0'],
 ['负重臀桥','gl',1,'','臀肌','哑铃','坐在地上，把哑铃放在髋部，向上顶髋并夹紧臀肌。练臀肌，也有助改善髋部活动度。',1642,'AlucardEvil40','CC-BY-SA 4.0'],
 ['臀推','gl',2,'','臀肌','长凳'],
 ['单腿哑铃臀推','gl',2,'','臀肌','长凳、哑铃','上背靠在长凳上，一条腿抬起，另一条腿伸展髋部，单侧孤立收缩臀肌。左右分开练，对臀肌刺激更充分。',1234,'carlos3c','CC-BY-SA 4.0'],
 ['弹力带臀部后踢','gl',1,'','臀肌','弹力带','四点跪姿，把弹力带固定在脚上，脚跟向后、向上踢，顶端夹紧臀肌。核心保持稳定，背部保持平直。',1613,'Tierrasverdes','CC-BY-SA 4.0'],
 ['哑铃驴子踢腿','gl',1,'','臀肌、腘绳肌','哑铃、垫子','在垫子上四点跪姿，手在肩的正下方、膝在髋的正下方，用哑铃增加阻力，向后上方踢腿。主要练臀肌和大腿后侧。',1616,'Tierrasverdes','CC-BY-SA 4.0'],

 ['器械臀部后踢','gl',2,'b','臀肌','器械','用脚跟发力，不要用脚尖。顶端不要过度反弓下背。',1723,'barry','CC-BY-SA 4.0'],
 ['蚌式开合','gl',0,'','臀肌、核心','徒手','摆成侧撑姿势（前臂和肘撑地，双腿略弯）。双脚靠拢，抬起上方的膝盖，像贝壳张开，再慢慢回到起点。核心保持稳定，髋部对齐。',1823,'teus_ergaster','CC-BY-SA 4.0'],
 ['弹力带蚌式开合','gl',1,'','臀肌、核心','弹力带','动作同蚌式开合，另外在膝盖上方的大腿间套一根对折的弹力带。',1842,'Croak6728','CC-BY-SA 4.0'],
 ['侧卧髋外展','gl',0,'','臀肌（髋外侧）','徒手','侧卧，上方的腿伸直、下方的腿屈膝支撑。把上方的腿抬离地面，在顶端停一下。',1202,'wakanda90','CC-BY-SA 4.0'],
 ['反向蚌式开合','gl',0,'','臀肌','徒手','侧卧，屈髋屈膝，两膝上下叠放。先让双脚并拢、两膝保持贴合，抬起上方的脚，再慢慢放下。动作只来自髋部，不要让骨盆向后翻。幅度小、控制好，重点是髋部旋转。',2448,'TobiasFalk','CC-BY-SA 4.0'],
 ['器械髋外展（坐姿）','gl',2,'','臀肌','器械','坐进器械，背靠垫子；大腿内侧抵住阻力垫，调整座位让髋关节对准器械转轴。从双腿并拢或略压住垫子开始，慢慢向外分开。',1748,'Tierrasverdes','CC-BY-SA 4.0'],
// 髋铰链 hg
 ['哑铃罗马尼亚硬拉','hg',1,'b','腘绳肌、臀肌','哑铃','双手各持一只哑铃，在髋部向前屈，保持背部挺直，再回到站立。主要练大腿后侧和臀肌。',1652,'AlucardEvil40','CC-BY-SA 4.0'],
 ['罗马尼亚硬拉','hg',2,'b','腘绳肌、臀肌','哑铃或杠铃'],
 ['早安式','hg',0,'b','腘绳肌','徒手','双脚比肩宽，双手放在髋部。从髋部折叠，上身向地面前倾，背部保持挺直，再回到站立。',1392,'captive0592','CC-BY-SA 4.0'],
 ['腿弯举','hg',2,'','腘绳肌','器械','腿弯举（也叫腘绳肌弯举）是孤立练大腿后侧的动作：在阻力下把小腿弯向臀部。',364,'BFad07','CC0'],
 ['俯卧腿弯举','hg',2,'','腘绳肌','器械'],
// 水平推 hp
 ['标准俯卧撑','hp',0,'s','胸肌、手臂、肩','徒手','从平板支撑姿势开始，手比肩略宽，双脚并拢，从头到脚成一条直线。收紧核心，屈肘放低身体，再推回起点。',1551,'Settebello','CC-BY-SA 4.0'],
 ['跪姿俯卧撑','hp',0,'s','胸肌、肩','徒手','双膝并拢跪地，双手在身前略比肩宽、位于肩的正下方，身体从头到膝成一条直线。屈肘降低躯干，躯干保持稳定，膝盖不离地，再用手推地回到起点。',1218,'PaukOne','CC-BY-SA 4.0'],
 ['上斜俯卧撑（手扶椅子）','hp',0,'s','胸肌、三头肌','椅子或长凳','上半身抬高，主要练胸肌，同时练到三头肌、肩和核心。与标准俯卧撑相比，三头肌参与较少。',1111,'anon1337','CC-BY-SA 4.0'],
 ['哑铃地板卧推','hp',1,'s','胸肌','哑铃','双手持哑铃仰卧，屈膝、双脚踩地（有长凳可以用）。把哑铃推起到肘部伸直，再慢慢放下，直到上臂靠近身体并贴到地面，停一下再推起。顶端夹紧胸肌。',1084,'','CC-BY-SA 4.0'],
 ['哑铃卧推','hp',2,'s','胸肌','哑铃、长凳','坐在平凳的一端，把哑铃竖直靠在大腿上。身体向后躺的同时，用膝盖把哑铃顶向胸口。双脚踩稳地面，肩胛骨向后夹紧、贴住长凳，下背保持自然的弧度，再把哑铃向上推向天花板。',75,'wger.de','CC-BY-SA 3.0'],
 ['胸部推举机','hp',2,'s','胸肌','器械','调整座椅高度，让把手与胸口平行。用腿蹬脚踏板，把把手带到起始位置。背部贴紧靠垫，向外推，推出时呼气。让把手轻轻回到胸口，回来时吸气。',129,'wger.de','CC-BY-SA 3.0'],
// 垂直推、侧平举 vp
 ['哑铃肩推','vp',1,'s','肩部','哑铃','坐在长凳上，靠背接近垂直。双手持哑铃举到肩高，手掌和肘全程朝前。向上推起，最高点哑铃靠近但不碰到，再慢慢放下重复。',567,'wger.de','CC-BY-SA 3.0','哑铃推肩'],
 ['哑铃侧平举','vp',1,'s','肩部（三角肌）','哑铃','练三角肌。手臂伸直或微屈，把哑铃向两侧抬到约与肩同高。身体略向前倾，髋和膝微屈。',348,'wger.de','CC-BY-SA 3.0'],
// 水平拉 hr
 ['哑铃俯身划船','hr',1,'b','背阔肌','哑铃','双手各持一只哑铃，髋部折叠、臀向后推，上身与地面约成 45–75°，膝盖微屈。哑铃垂在肩下，手臂伸直，背保持平直、挺胸、核心收紧，不要弓背。再把哑铃拉向肋骨或髋的方向。',2669,'karthikrrk','CC-BY-SA 4.0'],
 ['哑铃单臂划船','hr',1,'b','背阔肌','哑铃','俯身直到手垂在膝盖以下，上身角度保持不变。收紧背阔肌，把肘向后拉并夹紧肩胛。每一次都不要站起来，手要低于膝盖。',81,'sebk','CC-BY-SA 4.0','哑铃单臂划船（扶椅）'],
 ['胸托哑铃划船','hr',2,'','背阔肌、二头肌','可调长凳、哑铃','把可调长凳调到 45°，俯卧，头悬在凳沿上方。双手各持哑铃，核心和背阔肌收紧、肩部中立。向上腹部方向划，顶端夹紧背部，再放回起点。',1283,'carlos3c','CC-BY-SA 4.0'],
 ['弹力带坐姿划船','hr',1,'','背阔肌','弹力带','坐在地上，双腿伸直、背挺直。弹力带绕过双脚脚掌，双手各握一端，手臂伸直、膝微屈。让肘直直向后，把弹力带拉向下肋，夹紧肩胛。挺胸，躯干不要后仰借力。',2635,'trs1800','CC-BY-SA 4.0'],
 ['坐姿划船','hr',2,'','背阔肌','绳索器械','坐在器械上双脚踩稳，比肩略宽。脚跟蹬地、夹紧臀部，握住把手，坐直、膝微屈。收紧腹部和下背，让躯干垂直于地面。肩膀往后往下沉，划船时夹紧肩胛，想象两肩胛间夹着一支铅笔。',1117,'Franpol','CC-BY-SA 4.0'],
// 垂直拉 vr
 ['高位下拉','vr',2,'','背阔肌','绳索器械','起始双臂在头上伸直，感觉背阔肌被拉伸，肩膀下沉、不要耸肩。拉的时候让肘向下向后带，把横杆拉到上胸或锁骨附近。挺胸，底部夹紧肩胛。',723,'tuckerm','CC-BY-SA 3.0'],
// 肩后束与上背 rd
 ['弹力带面拉','rd',1,'','上背、肩后束','弹力带','站姿水平拉。握住弹力带到脸的高度，让肘抬高并向外，朝脸的方向拉，同时夹紧肩胛。练上背和肩后束，有助改善体态。',1732,'54str','CC-BY-SA 4.0'],
 ['弹力带拉开','rd',1,'','上背、肩后束','弹力带','双手握住弹力带，手臂在身前伸直、与肩同高，肘微屈并固定。向两侧拉开直到弹力带接近胸口，再缓慢回到起点，控制张力。',1380,'schwolfar','CC-BY-SA 4.0'],
 ['绳索面拉','rd',2,'','上背、肩后束','绳索器械'],
 ['俯卧W字','rd',0,'','上背、肩后束','徒手'],
 ['胸托后束飞鸟（Y 字）','rd',2,'','肩后束','可调长凳、轻哑铃','把上斜凳调到 30–45°，胸贴凳面俯卧，头保持中立或略朝下，避免颈部压力。手握轻哑铃、掌心相对（拇指朝上）。手臂伸直或微屈，向上向外举成“Y”字。动作要来自肩和肩胛，不要用身体甩。',1825,'beagle','CC-BY-SA 4.0'],
 ['哑铃俯身面拉','rd',1,'b','上背、肩','哑铃','用哑铃做俯身面拉，练上背和肩。把重量拉向脸部，肘保持高位，夹紧肩胛。',1639,'AlucardEvil40','CC-BY-SA 4.0'],
// 三头、二头
 ['哑铃俯身臂屈伸','tr',1,'s','三头肌','哑铃','双手各持一只哑铃，掌心相对躯干。背挺直、膝微屈，髋部前屈，躯干接近与地面平行，抬头。上臂紧贴躯干并与地面平行，前臂垂向地面、肘约成 90°，再向后伸直前臂。',655,'bodybuilding.com','CC-BY-SA 3.0'],
 ['哑铃臂屈伸','tr',1,'s','三头肌','哑铃','要点：肘部固定，肌肉主动发力，不借惯性，动作受控且缓慢，不要过度伸直。',1336,'Anastasious','CC-BY-SA 4.0'],
 ['绳索三头下压','tr',2,'','三头肌','绳索器械','常见的三头肌动作，容易学。通常做 8–12 次或更多，放在上肢或手臂训练日里。',805,'cshep442','CC-BY-SA 4.0'],
 ['哑铃弯举','bi',1,'','二头肌','哑铃','双手各持一只哑铃，手臂伸直、放在身体两侧，掌心朝内。屈臂把重量向上举，在动作一开始就把手臂旋转 90°，到最高点再稍微向外转一点。不停顿地慢慢放下。不要让身体晃动，全部由二头肌发力。',92,'wger.de','CC-BY-SA 3.0'],
// 核心 core
 ['平板支撑','core',0,'','核心','徒手','前臂和脚尖撑地，手臂弯曲、肘在肩的正下方。身体全程保持一条直线，尽量久地保持。想加大难度，可以抬起一只手臂或一条腿。',458,'YYCfit / BFad07','CC-BY-SA 3.0'],
 ['侧平板支撑','core',0,'','腹斜肌','徒手','练腹斜肌，帮助稳定脊柱。侧躺，用前臂和膝到脚的一侧撑起身体。',580,'bodybuilding.com','CC-BY-SA 4.0'],
 ['鸟狗式','core',0,'','核心、背部','徒手','核心稳定动作，提升平衡、协调和脊柱对位，冲击小。四点跪撑，手在肩下、膝在髋下，保持脊柱中立。右臂向前、左腿向后同时伸出，髋部保持端正，到最远处稍停。',1572,'Settebello','CC-BY-SA 4.0'],
 ['死虫','core',0,'','腹肌','徒手','仰卧，下背压向地面。对侧的手和脚缓慢伸出，脊柱保持中立，平稳呼吸。受控地收回，不要弓腰。',2752,'ruochenma','CC-BY-SA 4.0'],
 ['超人式','core',0,'b','下背、臀肌','垫子','俯卧，手臂向前伸直、双腿伸直放平。同时抬起手臂和双腿，像在飞，收紧下背，保持呼吸。按能力每次保持 2–5 秒。',636,'baldurmen','CC-BY-SA 4.0'],
 ['反向卷腹','core',0,'','腹肌','徒手','仰卧，手放在臀部附近。抬腿，到大约七成高度时骨盆也可以跟着抬起。顶端停 1–2 秒，再回到起点。',1772,'eufvksruh','CC-BY-SA 4.0'],
 ['帕洛夫推（抗旋转）','core',1,'','核心','弹力带或绳索','抗旋转动作，训练脊柱周围的大小肌群去抵抗旋转。侧身站在固定点旁，双手握住把手或弹力带，躯干正对前方，把手收到胸口中央，慢慢向前推出，再慢慢收回。',1194,'prevail90','CC-BY-SA 4.0'],
// 小腿 calf
 ['站姿提踵','calf',0,'','小腿','徒手'],
 ['哑铃提踵','calf',1,'','小腿','哑铃','双手各持一只哑铃，手臂自然下垂，双脚与髋同宽。想加大幅度，可以让前脚掌踩在台阶上。踮脚尽量抬高并稍停，再慢慢放下脚跟，直到小腿有拉伸感。膝盖微屈、不要锁死，上身保持直立。',2661,'','CC-BY-SA 4.0'],
// ---- 徒手动作扩充（wger）----
 ['椅子深蹲','sq',0,'k','臀肌、股四头肌','椅子或箱子','在身后放一把椅子（或箱子），高度要让你下蹲时能用臀部轻触到它，同时背部保持挺直。双脚与肩同宽、脚尖略外开，收紧核心、背部中立。像要坐到椅子上一样，向后坐、屈膝屈髋，让髋部下沉到椅面。',977,'clafal','CC-BY-SA 4.0'],
 ['正向箭步蹲','lg',0,'k','臀肌、股四头肌','徒手','站直，背挺直。左腿向前迈一大步，降低骨盆直到右膝几乎碰到地面，再抬起骨盆，退回一步回到起点。左右腿交替。',984,'','CC-BY-SA 4.0'],
 ['分腿蹲','lg',0,'k','臀肌、股四头肌','徒手','站直，背挺直，左腿向前迈一大步。降低骨盆，直到右膝几乎碰到地面，再抬起，重复。做完一侧再换另一侧。',991,'','CC-BY-SA 4.0'],
 ['侧向分腿蹲','lg',0,'k','大腿、臀部','徒手','站直，向侧面迈一大步，比肩略宽。弯曲一侧的膝盖，让大腿与地面平行，弯曲的膝盖要与脚尖在同一方向。再推回起点，重复。',986,'','CC-BY-SA 4.0'],
 ['哥萨克深蹲','lg',0,'k','腿部、臀部','徒手','哥萨克深蹲是多关节动作，主要练腿和臀，也需要稳定肌肉参与，能练力量、灵活性和稳定性。',1407,'clafal','CC-BY-SA 4.0'],
 ['扶椅分腿蹲','lg',0,'k','股四头肌','椅子或墙','前后分腿站，前脚在后脚前约一步，手扶稳固的支撑物（墙或椅背）。双膝弯曲让髋部垂直下降，直到后膝几乎碰到地面。上身保持直立，前脚脚跟着地，再用前脚发力推起。支撑物只用来保持平衡，不要靠它拉起身体。一侧做完再换另一侧。',2557,'','CC-BY-SA 3.0'],
 ['站姿抬腿（髋稳定）','gl',0,'','髋周围肌群','徒手','上身保持稳定，主要用一条腿站立，另一条腿不负重，反复抬起、在髋和膝处弯曲，再放下。两侧都做。这个动作练的是髋部周围肌群的稳定性。',1096,'tregga','CC-BY-SA 4.0'],
 ['宽距俯卧撑','hp',0,'s','胸肌外侧、肩','徒手','双手比肩宽，增加对胸外侧和肩的刺激。下放到胸部几乎碰地，核心收紧，再用手掌发力推起。不要塌腰，保持从头到脚一条直线。',1964,'Anon#2','CC-BY-SA 4.0'],
 ['钻石俯卧撑','hp',0,'s','胸肌、三头肌','徒手','平板支撑姿势，双手靠近放在胸下，拇指和食指围成菱形。屈肘让胸向双手下降，身体保持一条直线，再推起到手臂完全伸直。肘靠近身体，核心收紧。',386,'notdefine','CC-BY-SA 4.0'],
 ['三头肌俯卧撑','tr',0,'s','三头肌','徒手','针对三头肌的俯卧撑。平板支撑姿势，双手在肩的正下方，双脚并拢。下降时让肘夹在身体两侧、上臂指向正后方，降到胸部碰地再回到起点。',2684,'JuustoKakku','CC-BY-SA 4.0'],
 ['三点支撑俯卧撑','hp',0,'s','胸肌、核心','徒手','摆好俯卧撑姿势，肩在手的正上方，双脚与髋同宽。肚脐向脊柱收，收紧腹肌。左脚抬离地面约 5 厘米，脚尖朝下，髋部不要动，从头到脚始终成一条直线。然后屈肘，让胸部降到接近地面，再推起。换另一侧重复。',1209,'lxmx','CC-BY-SA 4.0'],
 ['站姿 T/Y/I 举臂','rd',0,'s','肩、上背','徒手','站直，双脚与髋同宽，核心收紧，手臂放松垂在身侧。依次做三种举臂：T 举（手臂向两侧伸直举到与地面平行）、Y 举（手臂向上约 45°举成 Y 字）、I 举（手臂并拢举过头顶成 I 字）。保持脊柱中立，不要反弓下背。',1606,'WiNNiE','CC-BY-SA 4.0'],
 ['YTW 举臂','rd',0,'s','肩胛之间的肌群','徒手','YTW 动作用来强化两肩胛之间的肌肉，帮助把肩往后收，保持挺拔的体态。',2454,'probablyforging','CC-BY-SA 4.0'],
 ['蝴蝶超人式','core',0,'b','上背、后颈','垫子','俯卧，十指交叉放在脑后，抬起头，并把双肘尽量向上抬。',1908,'cybro','CC-BY-SA 4.0'],
 ['跪姿对侧超人式','core',0,'','臀肌、大腿后侧、肩','徒手','四点跪姿，一只脚向后蹬直，直到整条腿伸直，脚要抬高、像被向后拉。手臂向前伸直，注意肩要抬高。单侧静态保持。',1910,'cybro','CC-BY-SA 4.0'],
 ['高位平板支撑','core',0,'s','核心','徒手','手和脚尖触地，背、手臂和腿都伸直。可以先趴在地上，双手掌心朝下放在头两侧，再把手臂撑直到这个位置。全程保持起始姿势。',1001,'','CC-BY-SA 4.0'],
 ['平板支撑伸手','core',0,'s','核心','徒手','摆成平板支撑，眼睛看地面。一只手向前抬起再收回，换另一只手。抬起和收回都要慢，身体尽量保持不动。',1766,'','CC-BY-SA 4.0'],
 ['平板支撑拍肩','core',0,'s','核心、肩','垫子','摆成标准平板支撑，双脚比肩略宽。交替抬起一只手，去触碰对侧的肩膀。',1091,'clafal','CC-BY-SA 4.0'],
 ['动态侧平板支撑','core',0,'','腹斜肌','徒手','侧躺，用一侧的肘和脚的外侧撑起身体，让髋部上下起落，同时身体保持一条直线。',1288,'painDpice','CC-BY-SA 4.0'],
 ['自行车卷腹','core',0,'','腹肌、腹斜肌','垫子','仰卧，手放在脑后，双腿伸直。让肩膀离地，一侧膝盖收向胸口，同时转体，让对侧的肘去碰膝盖。左右交替，像蹬自行车一样。动作要受控，核心全程发力。',1412,'hpmbala','CC-BY-SA 4.0'],
 ['抬腿卷腹','core',0,'','腹肌','垫子','仰卧，双腿笔直向上举。用双手去够脚尖，同时让肩胛骨离开地面，再放回。',174,'krisbbb','CC-BY-SA 4.0'],
 ['悬停卷腹','core',0,'','上腹','垫子','仰卧，双脚平放在地上，双臂交叉放在头上、手在脑后。抬起上身，让肩胛骨离开地面，在顶端停 1–2 拍。尽量让上腹发力，保持质量，做 10 次。目标是上身动、下半身不动。',1478,'Moffi','CC-BY-SA 4.0'],
 ['站姿侧屈卷腹','core',0,'','腹斜肌','徒手','站直，双脚与肩同宽，手放脑后。上身向一侧倾，收缩腹斜肌，让肘靠近髋。回到起点后左右交替，或做完一侧再换另一侧。这个动作能练腹斜肌，同时改善平衡与稳定。',1426,'hpmbala','CC-BY-SA 4.0'],
 ['单腿提踵','calf',0,'','小腿','台阶（可选）','站在地面或台阶边缘（台阶能加大活动幅度）。抬起一只脚，把脚跟抬高到踮脚站立，在顶端停 3 秒。慢慢放下脚跟，直到几乎碰到地面，不要砸下去。',1021,'','CC-BY-SA 4.0'],
// ---- 热身与拉伸 st ----
 ['儿童式','st',0,'','背部、髋、大腿','垫子','四点跪姿，膝盖、脚趾和双手着地，两只大脚趾相碰。把膝盖分开到与髋同宽。呼气时让骨盆向后，坐到脚跟上，双手仍贴地。上身放松，前额放到地面，双手自然向前滑。保持这个姿势。要出这个姿势，先把手走回到肩的正下方，再把上身抬起坐直。',1002,'','CC-BY-SA 4.0'],
 ['站姿小腿拉伸','st',0,'','小腿','墙或椅子','拉伸小腿肌（腓肠肌），随处都能做，只要有一面墙或一把椅子。',1239,'erikocobra','CC-BY-SA 4.0'],
 ['三头肌拉伸','st',0,'','三头肌','徒手','一只手放在背后，用另一只手抓住这只手的肘，轻轻往下拉。保持几秒，再换另一侧。',1230,'Lynn_McIntyre','CC-BY-SA 4.0'],
 ['肩部绕环','st',0,'','肩关节','徒手','坐着或站着，背挺直。双手放在肩上，以中等速度反复转动两侧肩关节，画圆。',1004,'','CC-BY-SA 4.0'],
 ['手臂绕环','st',0,'','肩、手臂','徒手','站直，背挺直。手臂保持伸直，从身前向下、绕到背后、再越过头顶回到原位，然后连续画圆。',994,'','CC-BY-SA 4.0'],
// ---- 女性常练：臀腿、髋、体态、手臂、核心（wger）----
 ['弹力带四点跪姿髋外展','gl',1,'','臀肌、髋外侧','弹力带','四点跪姿，体重均匀分在双膝和双手上。躯干保持稳定，收紧腹部，腰椎保持挺直、不要扭转（想象下背上放着一杯水，不会倒）。把一条腿向外侧抬起，抬腿时不要扭转。',1915,'treder','CC-BY-SA 4.0'],
 ['仰卧髋外展','gl',0,'','臀肌、髋外侧','垫子','仰卧在垫子上，双腿伸直放松，手臂放在身体两侧或向两边展开，帮助稳定。把一条腿轻轻抬离地面（伸直或略弯），再向外侧移动，远离身体中线。',1886,'teus_ergaster','CC-BY-SA 4.0'],
 ['哑铃青蛙推髋','gl',1,'','臀肌','哑铃','与臀推相似，但双脚并在一起，让膝盖向外打开成青蛙的姿势，再把臀部抬离地面（用哑铃增加阻力）。',1503,'JohnPreston','CC-BY-SA 4.0'],
 ['臀桥单臂哑铃推举','hp',1,'s','臀肌、胸','哑铃','单手持一只哑铃做臀桥。把哑铃举在胸口上方，这是每次的起始位置。放下哑铃，让肘碰到地面（如果用长凳，肘大约低于肩 45°），再把哑铃推回起始位置。',1686,'meldun','CC-BY-SA 4.0'],
 ['哑铃俯身侧抬肘（后束）','rd',1,'b','肩后束、上背','哑铃','双手各持一只哑铃，髋部前屈，让背接近与地面平行，手臂自然下垂并与肩在同一条线上。屈肘，把肘向两侧抬起，直到上臂与地面平行，再慢慢放回，重复。',1227,'Lynn_McIntyre','CC-BY-SA 4.0'],
 ['哑铃过头臂屈伸（双手握）','tr',1,'s','三头肌','哑铃','把一只哑铃举过头，双手托在内侧垫片下（像捧着一颗心的握法）。肘在头的上方，屈肘让前臂落到上臂后面。底部要注意别让哑铃撞到颈后。再伸直手肘，把哑铃举回头顶。',211,'tuninx','CC-BY-SA 3.0'],
 ['站姿宽距早安式','hg',0,'b','大腿后侧','徒手','双脚比肩宽，脚尖略向外，双手放在脑后。髋部折叠，让上身向地面下降，背保持挺直、胸打开。',1397,'captive0592','CC-BY-SA 4.0'],
 ['空心支撑','core',0,'','腹肌','垫子','在垫子上仰卧，收紧腹肌，伸直手臂和双腿并抬起（头和肩膀也离地）。保持下背始终贴住垫子。',297,'Behrooz','CC0'],
 ['仰卧交替打腿','core',0,'b','下腹','垫子','仰卧，把伸直的双腿抬离地面约 45°。一只脚向下、几乎碰到地面时，另一只脚尽量抬到 90° 或接近。再换脚，交替进行。',235,'nate303303','CC-BY-SA 4.0'],
 ['手撑地前走','core',0,'s','核心、肩','徒手','站姿，膝盖微屈，双手放在地上。从这个姿势开始，用双手向前走，同时保持臀部收紧、下背不要失控。',1103,'clafal','CC-BY-SA 4.0'],
 ['内收肌后坐拉伸','st',0,'','大腿内侧','徒手','四点跪姿，双手在肩的正下方、双膝在髋的正下方。一条腿向侧面伸直，脚掌平放、脚尖朝前。背保持平直，慢慢把髋部向后推向跪着那条腿的脚跟，直到感觉到拉伸。',2614,'','CC-BY-SA 4.0'],
 ['90/90 髋转换','st',0,'','髋、臀','徒手','坐在地上，一条腿在身前弯成 90°，另一条腿在侧面弯成 90°，让后面的小腿与前面的小腿平行。上身保持直立，可以的话手不要撑地。把双膝一起转向另一侧，让两条腿互换位置。',2613,'','CC-BY-SA 4.0'],
 ['髋屈肌拉伸','st',0,'','髋前侧、大腿前侧','徒手','跪成箭步姿势，一膝着地、另一只脚在前，双手叉腰。躯干保持直立，收紧后腿一侧的臀部，把髋部向前推，直到髋前侧和大腿前侧有拉伸感。保持一会，再换边。',1867,'Davidgj32','CC-BY-SA 4.0'],
 ['髋部交叉拉伸','st',0,'','髋、臀、下背','垫子','仰卧，手臂向两侧伸展，双腿并拢屈膝。把双膝慢慢倒向一侧，同时让肩膀和手臂保持贴地，你会在髋、臀和下背感到拉伸。稍停，把膝盖带回中间，再换另一侧。',1863,'Davidgj32','CC-BY-SA 4.0'],
 ['蝴蝶式拉伸','st',0,'','大腿内侧、髋','徒手','坐成祈祷姿势，双脚脚底轻轻相贴。用手慢慢把双脚拉向腹股沟，按需要保持。',1843,'Croak6728','CC-BY-SA 4.0'],
 ['青蛙式拉伸','st',0,'','臀、髋','垫子','四点跪姿，把膝盖向外打开，降低到用前臂撑地。肘和膝不动，开始前后摇动，让臀部尽量靠近脚。',1844,'Croak6728','CC-BY-SA 4.0'],
 ['台阶小腿拉伸','st',0,'','小腿','台阶、墙或栏杆','站在台阶或稳固的高处，前脚掌踩在边缘，脚跟悬空，扶着栏杆或墙保持平衡。让一只或双脚的脚跟降到低于台阶，感到小腿被拉伸并保持。膝盖伸直时，拉伸的是小腿的腓肠肌。',2666,'trs1800','CC-BY-SA 4.0'],
 // ---- 部位細分：胸、肩、背、二頭、小腿、大腿內側（wger）----
 ['哑铃上斜卧推','hp',2,'s','胸（上胸）、肩','上斜凳、哑铃','卧推的变化，重点刺激胸大肌的锁骨部（上胸）。把长凳调到 30–45° 之间，让躯干倾斜，推的角度改变，更多张力转到上胸和肩，有助于让上半身发展得更均衡、更立体。',537,'wger.de','CC-BY-SA 3.0'],
 ['蝴蝶机夹胸','hp',2,'s','胸肌','蝴蝶机','坐在蝴蝶机上，双脚踩实地面，上臂与地面平行。把双臂向中间夹，直到把手几乎碰在一起（但不要碰到）。再慢慢回来，重量全程保持悬空。',135,'wger.de','CC-BY-SA 3.0'],
 ['绳索上斜单臂推胸','hp',2,'s','胸肌','绳索器械','用绳索单臂推胸，另一只手撑住身体，把注意力放在推的力量上，而不是平衡。起始时手尽量靠近胸口，然后朝着略向上斜的方向，对准胸口中央推出。',1660,'Shiladree','CC-BY-SA 4.0'],
 ['绳索下斜单臂推胸','hp',2,'s','胸肌','绳索器械','用绳索单臂推胸，另一只手撑住身体，把注意力放在推的力量上，而不是平衡。起始时手尽量靠近胸口，然后朝着略向下斜的方向，对准胸口中央推出。',1656,'Shiladree','CC-BY-SA 4.0'],
 ['下斜俯卧撑（双脚垫高）','hp',0,'s','胸肌','长凳、椅子或台阶','下斜俯卧撑是传统俯卧撑的变化，用不同的方式刺激上半身肌肉。把双脚垫高在长凳、椅子或台阶上，双手撑地成俯卧撑姿势。身体保持从肩到脚踝一条直线，向地面下放，再推起。',1112,'anon1337','CC-BY-SA 4.0'],
 ['阿诺德推举','vp',1,'s','肩部','哑铃、有靠背的长凳','坐在有靠背的长凳上，双手各持哑铃放在肩前，掌心朝向自己、肘在身体前方。把哑铃向头顶推起，同时旋转手腕，让掌心在顶端朝前，在手肘锁死前停住。再受控地放下，同时把掌心转回朝向自己，回到起始位置。',20,'trzr23','CC-BY-SA 3.0'],
 ['单臂哑铃肩推','vp',1,'s','肩部','哑铃','把哑铃垂直向头顶推起，直到手臂完全伸直，但不要锁死手肘。再慢慢把哑铃放回肩的高度。',1968,'evtimovgeorg','CC-BY-SA 4.0'],
 ['弹力带前平举','vp',1,'s','肩前侧','弹力带','双脚站在弹力带中间，与髋同宽，双手各握一端放在大腿前。手臂保持伸直、肘微屈，把手向前举到与肩同高，再慢慢放下。可以双手一起做或交替做。换更强的弹力带或缩短弹力带，可以加大阻力。',2622,'trs1800','CC-BY-SA 4.0'],
 ['直臂下压','vr',2,'','背阔肌','绳索器械','手臂保持伸直但不锁死，用背阔肌发力，不要用肩膀。动作中不要让肩膀向上耸。',1726,'barry','CC-BY-SA 4.0'],
 ['器械坐姿划船','hr',2,'','背阔肌','划船器械','挺胸，拉到最后夹紧肩胛骨。不要驼背或弓背。',1725,'barry','CC-BY-SA 4.0'],
 ['锤式弯举','bi',1,'','二头肌','哑铃','开始：双手各持哑铃放在身体两侧，掌心朝向躯干。弯举：保持中立握法（像握锤子一样），把重量向肩膀举起。顶端收缩二头肌，肘不要向前移。放下：控制着慢慢回到起始位置。',272,'wger.de','CC-BY-SA 3.0'],
 ['交替哑铃弯举','bi',1,'','二头肌','哑铃','双手各持一只哑铃，手臂伸直、放在身体两侧，掌心朝内。一次弯一只手臂，把重量向上举，并在动作一开始就把手臂旋转 90°，到最高点再稍微向外转一点。不停顿地慢慢把手臂放下，再换另一只。',1192,'Franpol','CC-BY-SA 4.0'],
 ['地面臂屈伸（坐姿撑起）','tr',0,'s','三头肌','徒手','起始：坐在地上，双手在身后撑住身体，手指朝前，膝盖弯曲、双脚并拢。步骤：把髋部抬离地面、手臂伸直；再屈肘，让髋部下降；再伸直手臂回到上一个位置，重复。注：髋部抬得越高，难度越大。',1000,'','CC-BY-SA 4.0'],
 ['坐姿提踵','calf',2,'','小腿','提踵凳','坐在提踵凳上，确认脚掌有一半悬空，小腿能完全向下拉伸。把小腿向上提，尽量提高，在最高点停 1–2 秒，再慢慢下放。',590,'wger.de','CC-BY-SA 3.0'],
 ['器械站姿提踵','calf',2,'','小腿','提踵器械','站上提踵器械，要能让小腿完全下压。站直，不要塌腰、不要弯腿。尽量向上提起，在最高点停 1–2 秒，再慢慢下放。',622,'wger.de','CC-BY-SA 3.0'],
 ['坐姿髋内收（器械）','gl',2,'','大腿内侧','髋内收器械','背靠垫子坐在器械上，把大腿内侧抵住垫子，夹紧大腿内侧，稍停，再慢慢、受控地放回。',2699,'','CC-BY-SA 4.0'],

const UW = {'鸡蛋（煮熟）':'个','苹果':'个','香蕉':'根','全麦面包':'片'};

/* 飲食範本的輪替池（menu() 依天數 i 輪流挑選，已排除忌口的會被跳過）；順序有意義，不要重排 */
const MAINP = ['鸡胸肉（熟）','瘦牛肉（烤熟）','三文鱼（烤熟）','去皮鸡腿肉（烤熟）','鲈鱼（烤熟）','猪里脊（烤熟）','虾（煮熟）','老豆腐（较硬）','鳕鱼（烤熟）','豆腐（普通）'];
const VEGP = ['老豆腐（较硬）','毛豆（煮熟）','豆腐（普通）','黑豆（煮熟）','鹰嘴豆（煮熟）'];
const STAPLE = ['糙米饭（煮熟）','白米饭（煮熟）','红薯（烤熟）','土豆（煮熟）','玉米（煮熟）','荞麦面（煮熟）','意面（煮熟）'];
const BSTAPLE = ['燕麦粥（水煮）','全麦面包','红薯（烤熟）','玉米（煮熟）'];
const VEGS = ['西兰花（煮熟）','菠菜（煮熟）','小白菜（煮熟）','番茄','黄瓜','生菜（罗马生菜）','胡萝卜（煮熟）','香菇（煮熟）','青椒'];
const BEXTRA = ['无糖豆浆（低脂）','希腊酸奶（脱脂、原味）','脱脂牛奶'];
const FRUITS = [['香蕉',136],['苹果',182],['蓝莓',120],['橙子',150],['草莓',150],['苹果',182],['香蕉',136]];
const SNACKS = [
  [['希腊酸奶（脱脂、原味）',150],['蓝莓',80]],[['苹果',182],['杏仁',15]],[['香蕉',136],['杏仁',15]],
  [['无糖豆浆（低脂）',250],['草莓',100]],[['橙子',150],['核桃',15]],[['原味低脂酸奶',150],['草莓',100]],[['苹果',182],['核桃',15]]
];
</script>
<script>
/* ==== src/js/logic.js ==== */
/* 純邏輯：熱量計算、訓練排程、換動作、飲食範本、存檔檢查。
   不碰 DOM，只依賴 data-exercises.js、data-foods.js 定義的全域常數；瀏覽器與 Node 測試（tests/）共用同一份。
   語法層級刻意維持與原版相同（const/let、箭頭函式），不用 ?. ?? 與 ES module，以相容老版微信 X5/XWeb。 */

/* ---------- 常數 ---------- */
const GOAL = {fat:'减脂',muscle:'增肌塑形',shape:'改善体态、紧致线条',keep:'保持健康'};
const PLACE_LV = {gym:2,home:1,body:0};          // 場地 → 可用器材等級上限（動作 lv <= 這個值才能用）
const ACT_FACTOR = {2:1.35,3:1.45,4:1.55,5:1.6};  // 每週練幾天 → 活動係數
const SESSION_N = {30:4,45:5,60:6};               // 每次分鐘數 → 每天動作數
const INJ_NAME = {k:'膝盖',b:'腰背',s:'肩颈'};    // 不適部位代碼 → 顯示名稱
const EGG = '鸡蛋（煮熟）';
const MEAL_SHARE = {b:.25,l:.35,d:.30,s:.10};     // 早餐、午餐、晚餐、加餐的熱量/蛋白質比例

/* ---------- 動作資料與索引 ---------- */
// 由 EXERCISE_ROWS 展開成物件陣列；別名在原動作後緊接著插入一行（只換名稱），順序與舊版逐筆相同。
function buildExercises(rows){
  const out=[];
  rows.forEach(function(r){
    const x={n:r[0],g:r[1],lv:r[2],t:r[3],mus:r[4],eq:r[5],how:r.length>6?r[6]:'',id:r.length>6?r[7]:'',au:r.length>6?r[8]:'',lic:r.length>6?r[9]:''};
    out.push(x);
    if(r[10]){ const y={}; for(const k in x) y[k]=x[k]; y.n=r[10]; out.push(y) }
  });
  return out;
}
const EXI = buildExercises(EXERCISE_ROWS);
const EXM = {}; EXI.forEach(function(x){ if(!EXM[x.n]) EXM[x.n]=x });            // 名稱 → 動作
const EXG = {}; EXI.forEach(function(x){ (EXG[x.g]=EXG[x.g]||[]).push(x) });       // 類別 → 動作（保持 EXI 順序）
const FOCUS_ROWS = {};                                                              // 重點部位 → 候選動作（依類別的保持 EXI 順序；arms 的 tr/bi 交錯順序與舊版相同）
Object.keys(FOCUS_G).forEach(function(k){ FOCUS_ROWS[k]=EXI.filter(function(x){ return FOCUS_G[k].indexOf(x.g)>=0 }) });
Object.keys(FOCUS_NAMES).forEach(function(k){ FOCUS_ROWS[k]=FOCUS_NAMES[k].map(function(n){ return EXM[n] }) });   // 依指定名稱（順序 = 優先順序）

// 這個人能做的動作名稱（依 rows 順序、去重）：器材等級在場地範圍內，且不碰她勾選的不適部位
function usableNames(rows,A){
  const lv=PLACE_LV[A.place], names=[];
  rows.forEach(function(x){ if(x.lv<=lv && !(x.t && A.injury.indexOf(x.t)>=0) && names.indexOf(x.n)<0) names.push(x.n) });
  return names;
}

/* ---------- 計算 ---------- */
function calc(A){
  const w=A.weight,h=A.height,a=A.age;
  const bmr = 10*w + 6.25*h - 5*a - 161;            // Mifflin-St Jeor（女）
  const af = ACT_FACTOR[A.days];
  const tdee = bmr*af;
  const bmi = w/Math.pow(h/100,2);
  const flagged = A.health.some(x=>x!=='none') || a<18;
  const low = bmi<18.5;
  let kcal = tdee, mode='维持';
  if(!flagged){
    if(A.goal==='fat' && !low){ kcal=Math.max(tdee*0.8,bmr,1200); mode='温和减脂' }
    else if(A.goal==='shape' && !low){ kcal=tdee*0.95; mode='轻微热量缺口' }
    else if(A.goal==='muscle'){ kcal=tdee*1.05; mode='轻微盈余' }
  }
  kcal = Math.round(kcal/10)*10;
  const pPerKg = (A.goal==='fat'||A.goal==='muscle') ? 1.8 : 1.5;
  const p = Math.round(w*pPerKg);
  const f = Math.round(kcal*0.27/9);
  const c = Math.max(100, Math.round((kcal-4*p-9*f)/4));
  const weekly = (kcal-tdee)*7/7700;                  // 约值
  return {bmr:Math.round(bmr),tdee:Math.round(tdee/10)*10,bmi,flagged,low,kcal,mode,p,f,c,weekly};
}

/* ---------- 訓練 ---------- */
// 第 i 天的重點加練：最多 2 個，輪流取她選的部位，避開當天已有的動作
function focusList(A,i,dayEx){
  const areas=(A.focus||[]).filter(function(x){ return FOCUS_ROWS[x] });
  if(!areas.length) return [];
  const out=[];
  for(let k=0;k<2;k++){
    const pool=usableNames(FOCUS_ROWS[areas[(i+k)%areas.length]],A);
    const free=pool.filter(function(n){ return dayEx.indexOf(n)<0 && out.indexOf(n)<0 });
    if(free.length) out.push(free[(i+k*2)%free.length]);
  }
  return out;
}
function workout(A){
  const n = SESSION_N[A.mins];
  const lib = LIB[A.place];
  const sw = A.sw || {};
  return SCHED[A.days].map(([key,title],i)=>{
    const day = WK[A.days][i];
    if(key==='cardio') return {day,title,cardio:true};
    let list = lib[key].filter(nm=>{ const t=EXM[nm].t; return !t || !A.injury.includes(t) });
    for(const s of SAFE){ if(list.length>=n) break; if(!list.includes(s)) list.push(s) }
    list = list.slice(0,n).map((nm,j)=> sw[i+'-'+j] || nm);
    return {day,title,ex:list,focus:focusList(A,i,list)};
  });
}
// 同類、可做、當天沒有、且不是同一個 wger 動作（別名）的替代動作，從目前動作的下一個開始輪
function alts(cur,dayEx,A){
  const m=EXM[cur]; if(!m) return [];
  const names=usableNames(EXG[m.g],A);
  const pos=names.indexOf(cur), out=[];
  for(let k=1;k<=names.length;k++){ const c=names[(pos+k+names.length)%names.length];
    if(c!==cur && dayEx.indexOf(c)<0 && !(m.id && EXM[c].id===m.id)) out.push(c) }
  return out;
}
// 「换一个」：把第 i 天第 j 個動作換成下一個替代動作，記在 A.sw；沒有替代就回傳 false
function applySwap(A,i,j){
  const day=workout(A)[i]; const cur=day.ex[j];
  const list=alts(cur,day.ex,A); if(!list.length) return false;
  A.sw=A.sw||{}; A.sw[i+'-'+j]=list[0];
  return true;
}
function exLine(nm,A){
  const [sets,reps] = REPS[A.exp];
  if(TIMED.some(t=>nm.startsWith(t))) return sets.split('–')[0]+' 组 × 20–40 秒';
  if(nm.startsWith('站姿提踵')||nm.startsWith('哑铃提踵')) return sets+' 组 × 15–20 次';
  if(/死虫|鸟狗式|超人式|俯卧W字|蚌式|后踢|驴子踢腿|侧卧髋外展|帕洛夫|单腿臀桥/.test(nm)) return sets+' 组 × 每侧/每次 8–12 次';
  if(/箭步|分腿蹲|上台阶|单臂|单腿/.test(nm)) return sets+' 组 × 每侧 '+reps+' 次';
  return sets+' 组 × '+reps+' 次';
}

/* ---------- 飲食 ---------- */
const FM = {}; FOODS.forEach(function(f){ FM[f.n]=f });                            // 名稱 → 食物
function g5(x){ return Math.max(5, Math.round(x/5)*5) }                            // 取 5 克的倍數，最少 5 克
function qty(n,g){
  const f=FM[n];
  if(UW[n] && f.u){ const c=Math.max(0.5, Math.round(g/f.u*2)/2); return n.replace(/（.*）/,'')+' '+c+' '+UW[n]+'（约 '+Math.round(c*f.u)+' g）' }
  return n+' '+g+' g';
}
function itemStats(it){ const f=FM[it.n]; return {k:f.k*it.g/100, p:f.p*it.g/100, c:f.cb*it.g/100, f:f.f*it.g/100} }
const NOBEEF = ['瘦牛肉（烤熟）','羊腿肉（瘦、烤熟）'];   // 「不吃牛羊肉」要排除的食物
function allowed(f,A){
  if(f.t==='d' && A.diet.indexOf('lactose')>=0) return false;
  if(f.t==='s' && A.diet.indexOf('seafood')>=0) return false;
  if((f.t==='m'||f.t==='s') && A.diet.indexOf('veg')>=0) return false;
  if(A.diet.indexOf('nobeef')>=0 && NOBEEF.indexOf(f.n)>=0) return false;   // 不吃牛羊肉
  if(A.diet.indexOf('nopork')>=0 && f.n==='猪里脊（烤熟）') return false;
  return true;
}
function pickFrom(list,i,A){
  const L=list.filter(function(n){ return allowed(FM[n],A) });
  return L[((i%L.length)+L.length)%L.length];
}
function menu(A,C){
  const sh=MEAL_SHARE, egg=FM[EGG];
  const proteinPool = A.diet.indexOf('veg')>=0 ? VEGP : MAINP;
  const days=[];
  for(let i=0;i<7;i++){
    const meals=[];
    // 早餐：固定 1 份蛋（100 g），蛋白質不夠再加豆浆/酸奶/牛奶
    {
      const pM=C.p*sh.b, items=[{n:EGG,g:100}];
      const left=pM-egg.p;
      if(left>6){ const e=pickFrom(BEXTRA,i,A); items.push({n:e,g:Math.min(300,g5(left/FM[e].p*100))}) }
      const st=BSTAPLE[i%BSTAPLE.length];
      items.push({n:st,g:g5(C.c*sh.b/FM[st].cb*100*0.75),st:1});
      const fr=FRUITS[i%FRUITS.length]; items.push({n:fr[0],g:fr[1]});
      meals.push({name:'早餐',items:items,hint:'鸡蛋：水煮或蒸蛋；燕麦粥不加糖'});
    }
    // 午餐、晚餐：[名稱, 蛋白質池位移, 比例]
    [['午餐',0,sh.l],['晚餐',3,sh.d]].forEach(function(m,mi){
      const pM=C.p*m[2], pn=pickFrom(proteinPool,i+m[1],A), pf=FM[pn];
      const items=[]; let g=Math.min(260,g5(pM/pf.p*100)); items.push({n:pn,g:g});
      const got=pf.p*g/100;
      // 主菜蛋白質不到目標 8 成就補蛋（每個 50 g、約 6.3 g 蛋白質），1–3 個
      if(got<pM*0.8 && allowed(egg,A)){ const c=Math.min(3,Math.max(1,Math.round((pM-got)/(egg.p/2)))); items.push({n:EGG,g:c*egg.u}) }
      const st=pickFrom(STAPLE,i+(mi?2:0),A);
      items.push({n:st,g:g5(C.c*m[2]/FM[st].cb*100*0.8),st:1});
      items.push({n:pickFrom(VEGS,i+(mi?2:0),A),g:100});
      items.push({n:pickFrom(VEGS,i+(mi?6:4),A),g:100});
      items.push({n:'橄榄油',g:5});
      meals.push({name:m[0],items:items,hint:pf.ck+'；用油约 1 茶匙，其余清淡调味'});
    });
    // 加餐
    {
      const L=SNACKS.filter(function(x){ return x.every(function(y){ return allowed(FM[y[0]],A) }) });
      const sn=L[i%L.length];
      meals.push({name:'加餐',items:sn.map(function(y){ return {n:y[0],g:y[1]} }),hint:'下午或训练前后吃'});
    }
    // 总热量校准：只调整主食克数，让全天接近目标
    let tot=0, stk=0;
    meals.forEach(function(m){ m.items.forEach(function(it){ const k=itemStats(it).k; tot+=k; if(it.st) stk+=k }) });
    if(stk>0){
      const fct=Math.min(1.8,Math.max(0.5,(C.kcal-(tot-stk))/stk));
      meals.forEach(function(m){ m.items.forEach(function(it){ if(it.st) it.g=g5(it.g*fct) }) });
    }
    let day={k:0,p:0,c:0,f:0};
    meals.forEach(function(m){
      m.k=0;m.p=0;
      m.items.forEach(function(it){ const x=itemStats(it); m.k+=x.k; m.p+=x.p; day.k+=x.k; day.p+=x.p; day.c+=x.c; day.f+=x.f });
    });
    days.push({day:'第 '+(i+1)+' 天',meals:meals,total:day});
  }
  return days;
}

/* ---------- 上次存檔的檢查 ----------
   localStorage 的內容不可信（GitHub Pages 同一個 username.github.io 底下的其他頁面共用 localStorage、
   舊版格式、手動竄改都有可能），而 A 的部分欄位會直接拼進 innerHTML 或拿來查表。
   原則：只擋「會被拼進 HTML 的非預期值」與「會讓原版程式出錯的值」，其他照原版寬鬆接受：
   - goal/exp/place/days/mins 必須是本頁選項之一（days、mins 會原樣顯示在頁面上）
   - age/height/weight 必須是正數；waist 可為 null 或數字（不顯示）
   - injury/health/diet 必須是字串陣列；focus、eat、sw 可以缺少（舊版存檔可能沒有，原版也能顯示）
   - 字串不得是 Object.prototype 上的名稱（例如 constructor），否則查表會取到函式
   - sw（換過的動作）必須是動作資料裡的名稱，因為它會原樣顯示 */
function has(o,k){ return Object.prototype.hasOwnProperty.call(o,k) }
function isPos(x){ return typeof x==='number' && isFinite(x) && x>0 }
function isStrArr(x){ return Array.isArray(x) && x.every(function(v){ return typeof v==='string' && !(v in Object.prototype) }) }
function validSaved(A){
  if(!A || typeof A!=='object' || Array.isArray(A)) return false;
  if(!has(GOAL,A.goal) || !has(REPS,A.exp) || !has(LIB,A.place)) return false;
  if(typeof A.days!=='number' || !has(SCHED,A.days) || typeof A.mins!=='number' || !has(SESSION_N,A.mins)) return false;
  if(!isPos(A.age) || !isPos(A.height) || !isPos(A.weight)) return false;
  if(A.waist!=null && !(typeof A.waist==='number' && isFinite(A.waist))) return false;
  if(!isStrArr(A.injury) || !isStrArr(A.health) || !isStrArr(A.diet)) return false;
  if(A.focus!==undefined && !isStrArr(A.focus)) return false;
  if(A.eat!==undefined && typeof A.eat!=='string') return false;
  if(A.sw!==undefined){
    if(!A.sw || typeof A.sw!=='object' || Array.isArray(A.sw)) return false;
    for(const k in A.sw){ if(!/^\d+-\d+$/.test(k) || typeof A.sw[k]!=='string' || !has(EXM,A.sw[k])) return false }
  }
  return true;
}
</script>
<script>
/* ==== src/js/render.js ==== */
/* 卡片 HTML：只把資料組成 HTML 字串，不碰 DOM（Node 測試可直接比對輸出）。
   安全前提：拼進 HTML 的只有本頁常數（動作、食物、文案）、計算出的數字，以及經 validSaved() 檢查過的存檔欄位；
   沒有任何使用者自由輸入的文字。若日後加入自由輸入，必須先做 HTML 跳脫。 */

const F = x=>x.toFixed(1);
function summaryCard(A,C){
  let w='';
  if(C.flagged) w+='<div class="warn">你勾选了怀孕/哺乳、慢性病或年龄未满 18 岁。这种情况我只给「维持体重」的参考，不做热量缺口。开始训练或调整饮食前，请先问过医生。</div>';
  if(C.low && !C.flagged && (A.goal==='fat'||A.goal==='shape')) w+='<div class="warn">你的 BMI 偏低（'+F(C.bmi)+'），不建议再减重，所以热量按维持来算，重点放在力量训练和吃够蛋白质。</div>';
  const wk = Math.abs(C.weekly)<0.05 ? '体重基本持平' : (C.weekly<0?'每周约 -':'每周约 +')+F(Math.abs(C.weekly))+' kg（估算）';
  // 比例條：依熱量占比（蛋白質、碳水 4 kcal/g，脂肪 9 kcal/g）
  const kp=C.p*4, kc=C.c*4, kf=C.f*9, tot=kp+kc+kf;
  const pp=Math.round(kp/tot*100), cp=Math.round(kc/tot*100), fp=100-pp-cp;
  return '<div class="card sum"><h3>你的专属方案</h3>'+
  '<div class="muted">每日建议摄入</div>'+
  '<div class="big"><b>'+C.kcal+'</b><span>kcal</span></div>'+
  '<div class="muted">目标：'+GOAL[A.goal]+' · 每周练 '+A.days+' 次 · 每次约 '+A.mins+' 分钟</div>'+w+
  '<div class="mbar"><i class="m1" style="width:'+pp+'%"></i><i class="m2" style="width:'+cp+'%"></i><i class="m3" style="width:'+fp+'%"></i></div>'+
  '<div class="mleg"><span><s class="m1"></s>蛋白质 <b>'+C.p+' g</b></span><span><s class="m2"></s>碳水 <b>'+C.c+' g</b></span><span><s class="m3"></s>脂肪 <b>'+C.f+' g</b></span></div>'+
  '<div class="rows">'+
  '<div><span>BMI</span><b>'+F(C.bmi)+'</b></div>'+
  '<div><span>基础代谢（静息）</span><b>'+C.bmr+' kcal</b></div>'+
  '<div><span>每日总消耗（估）</span><b>'+C.tdee+' kcal</b></div>'+
  '<div><span>预期体重变化</span><b>'+wk+'</b></div></div>'+
  '<div class="muted">以上都是公式估算，不是医学诊断。按 2–3 周的实际体重变化再微调。</div></div>';
}

/* ---------- 動作說明（示範圖、影片入口、wger 來源） ---------- */
function mediaBlock(m){
  let h='';
  const L=IMGS[m.id]||[];
  if(L.length){
    h+='<div class="imgs">'+L.map(function(x){ return '<img loading="lazy" src="img/'+x.f+'" alt="'+m.n+' 示范图">' }).join('')+'</div>';
    const au=[]; L.forEach(function(x){ const t=(x.au||'wger 社区')+'（'+x.lic+'）'; if(au.indexOf(t)<0) au.push(t) });
    h+='<div class="muted">示范图作者：'+au.join('、')+'，来自 wger.de。</div>';

function srcLine(m){

// 「怎么做」展開區塊（訓練計劃、重點加練、熱身拉伸共用）
function howBlock(m){

}
function exItem(nm,i,j,A,dayEx){

/* ---------- 訓練計劃 ---------- */
function workoutCard(A){
  const W = workout(A); const rest = REPS[A.exp][2];

  h += '<div class="week">'+['周一','周二','周三','周四','周五','周六','周日'].map(function(n){
    const d=W.filter(function(x){ return x.day===n })[0];
    return '<span class="wd'+(d?(d.cardio?' cd':' on'):'')+'" data-d="'+n+'"></span>';
  }).join('')+'</div>';
  W.forEach((d,i)=>{
    h += '<div class="day"><h4><span>'+d.day+'</span>'+d.title+'</h4>';

      h += '<ul class="t"><li>快走、椭圆机或骑车 30–40 分钟，强度以「能说话、不能唱歌」为准</li><li>结束后做 8–10 分钟拉伸：大腿前后侧、臀部、胸肩</li></ul>';
    } else {
      h += '<ol>'+d.ex.map((e,j)=>exItem(e,i,j,A,d.ex)).join('')+'</ol>';
      if(d.focus && d.focus.length){
        h += '<div class="muted" style="margin-top:6px">重点加练（约 8 分钟，每个动作 2 组）</div><ol>'+d.focus.map(function(e){ return focusItem(e,A) }).join('')+'</ol>';
      }
    }

  });
  const cardio = (A.goal==='fat'||A.goal==='shape') ? '每周另外加 2–3 次快走或其他有氧，每次 30 分钟。' : '每周加 1–2 次轻松有氧，每次 20–30 分钟即可。';

  h += '<div class="day"><h4><span>热身</span>每次训练前 5 分钟</h4><ol>'+['肩部绕环','手臂绕环'].map(function(n){ return stItem(n) }).join('')+'</ol></div>';
  h += '<div class="day"><h4><span>拉伸</span>训练后 5–8 分钟</h4><ol>'+['儿童式','站姿小腿拉伸','三头肌拉伸'].map(function(n){ return stItem(n) }).join('')+'</ol></div>';
  h += '<div class="day"><h4><span>进阶</span>怎么加重量</h4><ul class="t"><li>热身 5–8 分钟：关节活动加上第一个动作的空杆或轻重量。</li><li>某个动作连续两次、每组都做到次数上限，下次就加一点重量（哑铃加 1–2 kg，或换更强的弹力带）。</li><li>徒手动作做不到加重时，改成放慢下放速度（3 秒）或增加每组次数。</li></ul></div>';
  const wantF=(A.focus||[]).filter(function(x){ return FOCUS_ROWS[x] });
  const noneF=wantF.filter(function(x){ return !usableNames(FOCUS_ROWS[x],A).length });
  if(noneF.length){
    h += '<div class="warn">你选的重点部位里，「'+noneF.map(function(x){ return FOCUS_LABEL[x] }).join('、')+'」在你的器材和不适部位限制下，目前没有合适的加练动作，所以这次没有为它加。可以换个重点部位，或在「动作库」里挑安全的动作。</div>';
  }

    const names=A.injury.filter(x=>INJ_NAME[x]).map(x=>INJ_NAME[x]).join('、');

  }
  h += '<div class="muted" style="margin-top:8px">动作资料来自开源项目 <b>wger</b>（wger.de），按 CC-BY-SA 授权，作者见各动作说明；中文要点由本页改写。</div>';

}

/* ---------- 飲食計劃 ---------- */
function menuCard(A,C){

  M.map(function(d,i){

}

/* ---------- 動作庫 ---------- */
const LIB_TITLE = {0:'徒手动作库',1:'家里器材动作库（哑铃、弹力带）',2:'健身房动作库',st:'热身与拉伸',w:'女性常练动作库'};
function inScope(x,scope){

      const w = (m.t && A.injury.indexOf(m.t)>=0) ? '<div class="warn" style="margin:4px 0">你选了「'+INJ_NAME[m.t]+'」不适，这个动作对该部位压力较大，不建议做。</div>' : '';
      h += '<details class="xd"><summary style="font-size:15px;color:var(--ink)">'+m.n+' <span class="muted">'+m.mus+'</span></summary><div class="xb"><div class="muted">器材：'+m.eq+'</div>'+m.how+w+mediaBlock(m)+srcLine(m)+'</div></details>';
    });
    h += '</div>';
  });
  return h+'</div>';
}

/* ---------- 食物庫 ---------- */
const FOOD_TAG = {m:'肉',s:'海鲜',e:'蛋',d:'含乳糖'};
function foodLibCard(A){
  const cats=[]; FOODS.forEach(function(f){ if(cats.indexOf(f.c)<0) cats.push(f.c) });

        '<br><small>热量 '+f.k+' kcal · 蛋白质 '+f.p.toFixed(1)+' g · 碳水 '+f.cb.toFixed(1)+' g · 脂肪 '+f.f.toFixed(1)+' g</small>'+
        (f.us?'<br><small>份量：'+f.us+'</small>':'')+(f.ck?'<br><small>吃法：'+f.ck+'</small>':'')+'</div>';
    });

  });
  return h+'<div class="muted" style="margin-top:8px">带「熟」的是煮熟、烤熟后的重量，不带的是生吃的重量。</div></div>';
}

/* ---------- 小貼士、複製摘要 ---------- */
function tipsCard(A,C){
  return '<div class="card"><h3>小贴士</h3><ul class="t">'+
  '<li><b>喝水：</b>每天 1.5–2 升，训练日再多一点。</li>'+
  '<li><b>睡眠：</b>尽量 7–8 小时，睡不够会更容易饿、恢复也慢。</li>'+
  '<li><b>称重：</b>每周固定同一天、同一时间（早上空腹）称 1–2 次，看趋势，不盯单日数字。</li>'+
  '<li><b>生理期：</b>体重会因水分波动，不用慌。状态差就降低强度或改成散步拉伸，不必硬撑。</li>'+
  '<li><b>身体信号：</b>头晕、心慌、持续乏力或生理期紊乱，说明吃得太少或练得太多，请调整并咨询医生。</li>'+
  '<li><b>复盘：</b>坚持 2–3 周后，用新的体重和感受再来算一次，计划也会跟着更新。</li></ul></div>';
}
function planText(A,C){
  let t='【我的健身计划】\n目标：'+GOAL[A.goal]+'\n每日建议摄入 '+C.kcal+' kcal（蛋白质 '+C.p+'g / 碳水 '+C.c+'g / 脂肪 '+C.f+'g）\n\n训练安排：\n';
  workout(A).forEach(d=>{ t+=d.day+' '+d.title+'：'+(d.cardio?'有氧 30–40 分钟 + 拉伸':d.ex.join('、'))+'\n' });
  return t+'\n（公式估算，非医学建议）';

</script>
<script>
/* ==== src/js/questions.js ==== */
/* 問卷：問什麼、有哪些選項、答完怎麼回應、答案怎麼寫進 A。純資料與純函式，不碰 DOM（Node 測試可直接驗證所有題目）。
   app.js 負責把這些步驟畫成聊天、處理「改上一題」。
   設計原則（行為引導）：
   - 少問：年齡、身高、體重合成一張卡；每週幾天與每次多久合成「你能留出多少時間」一題（共 10 題，原本 14 題）。
   - 用生活語言問，不問術語：運動基礎問「最近三個月更像哪一種」，不適部位問「爬楼梯、下蹲时膝盖会不舒服吗」。
   - 每題都有「說不清／還沒想好」這類出口，並給一個保守的預設；有依據時才標「建议」（只是建議，不是結論）。
   - 答完用一句話回應，並且只說程式真的會做的事。 */

const BMI_LOW = 18.5, BMI_HIGH = 24;     // 中國常用分界：低於 18.5 偏低，24 以上偏高
function bmiOf(h,w){ return w/Math.pow(h/100,2) }
function autoGoal(bmi){ return bmi>=BMI_HIGH ? 'fat' : bmi<BMI_LOW ? 'muscle' : 'shape' }
// 「我不確定，幫我定」：依運動基礎給容易坚持的安排
const AUTO_TIME = {new:{days:3,mins:30}, some:{days:3,mins:45}, reg:{days:4,mins:45}};

const REACT_GOAL = {
  fat:'好，目标减脂。我会按温和的节奏算，不会让你吃得太少。',
  muscle:'好，目标增肌塑形。我会把蛋白质和训练量排得足一些。',
  shape:'好，想改善体态、紧致线条。力量训练会是重点。',
  keep:'好，保持健康。我们按稳定、能长期坚持来排。'
};
const has2 = (v,x) => v.indexOf(x)>=0;

const STEPS = [
  // 1 身体数据：一张卡四行，不一题一题地问
  {k:'body', type:'nums',
   q:'先认识一下你。年龄、身高、体重大概是多少？点 − ＋ 调到你的数字（点数字也算确认），腰围可以不填。',
   fields:[
     {k:'age',label:'年龄',unit:'岁',min:14,max:75,def:30,s1:1,s2:5},
     {k:'height',label:'身高',unit:'cm',min:130,max:200,def:160,s1:1,s2:5},
     {k:'weight',label:'体重',unit:'kg',min:30,max:150,def:55,s1:0.5,s2:5},
     {k:'waist',label:'腰围',unit:'cm',min:50,max:140,def:70,s1:1,s2:5,optional:true}],
   set:(A,v)=>{ A.age=v.age; A.height=v.height; A.weight=v.weight; A.waist=v.waist },
   react:(v)=>{ const b=bmiOf(v.height,v.weight); return b<BMI_LOW ? '你的 BMI 是 '+b.toFixed(1)+'，偏低。之后我不会给你安排热量缺口。' : null }},
  // 2 目标
  {k:'goal', type:'pick',
   q:'你最想改变什么？',
   opts:(A)=>{ const b=bmiOf(A.height,A.weight); return [
     {label:'减脂',sub:'把体脂降下来，同时尽量保住肌肉',value:'fat',rec:b>=BMI_HIGH},
     {label:'增肌塑形',sub:'练出线条，让身体更有力量',value:'muscle',rec:b<BMI_LOW},
     {label:'改善体态、紧致',sub:'肩背更挺，整个人更紧致',value:'shape'},
     {label:'保持健康',sub:'不追求变化，把现在的状态稳住',value:'keep'},
     {label:'说不清，帮我判断',sub:'我按你的身高体重给一个建议',value:'auto'}] },
   set:(A,v)=>{ A.goal = v==='auto' ? autoGoal(bmiOf(A.height,A.weight)) : v },
   react:(v,A,opt)=>{
     const b=bmiOf(A.height,A.weight);
     if(opt && opt.value==='auto') return '我先帮你判断：BMI '+b.toFixed(1)+'，建议先按「'+GOAL[A.goal]+'」来排。不合适的话，点「改上一题」重选就行。';
     if(A.goal==='fat' && b<BMI_LOW) return '你的 BMI 偏低，减脂这一项我会按维持来算，重点放在力量训练和吃够蛋白质。';
     return REACT_GOAL[A.goal] }},
  // 3 運動基礎：用生活情境問
  {k:'exp', type:'pick',
   q:'最近三个月，你的运动情况更像哪一种？',
   opts:()=>[
     {id:'none',label:'几乎没怎么运动',sub:'平时以坐着和走路为主',value:'new'},
     {id:'some',label:'偶尔动一动',sub:'每周 1–2 次，没有固定节奏',value:'some'},
     {id:'back',label:'以前练过，中断了一阵子',sub:'想重新开始',value:'some'},
     {id:'reg',label:'一直有固定的训练习惯',sub:'每周 3 次以上',value:'reg'}],
   set:(A,v)=>{ A.exp=v },
   react:(v,A,opt)=> !opt ? null : opt.id==='none' ? '没关系，从零开始最稳，动作和组数我会先排得轻松一点。'
     : opt.id==='back' ? '好，重新开始最重要的是别一下子练太猛，我会按「有一点基础」来排。'
     : opt.id==='reg' ? '好，那训练量我会排得足一些。' : null },
  // 4 時間：每週幾天、每次多久合成一題，用「現實能留出多少」來問
  {k:'time', type:'pick',
   q:'时间上，你现实一点能留出多少？先选能坚持的，不是最理想的。',
   opts:(A)=>[
     {label:'每周 2 次，每次约 30 分钟',sub:'时间比较紧，先把习惯养起来',value:{days:2,mins:30}},
     {label:'每周 3 次，每次约 30 分钟',sub:'循序渐进，容易坚持',value:{days:3,mins:30},rec:A.exp==='new'},
     {label:'每周 3 次，每次约 45 分钟',sub:'节奏比较平衡',value:{days:3,mins:45},rec:A.exp==='some'},
     {label:'每周 4 次，每次约 45 分钟',sub:'比较投入，记得留出休息和睡眠',value:{days:4,mins:45},rec:A.exp==='reg'},
     {label:'每周 5 次，每次约 1 小时',sub:'全力投入，适合已经有基础的',value:{days:5,mins:60}},
     {label:'我不确定，帮我定',sub:'按你的基础，给一个容易坚持的安排',value:{auto:true}}],
   set:(A,v)=>{ const t = v.auto ? AUTO_TIME[A.exp] : v; A.days=t.days; A.mins=t.mins },
   react:(v,A)=> v.auto ? '那就先按你的基础来：每周 '+A.days+' 次，每次约 '+A.mins+' 分钟，先把习惯养起来。' : null },
  // 5 場地
  {k:'place', type:'pick',
   q:'你平时更方便在哪里练？',
   opts:()=>[
     {id:'gym',label:'健身房',sub:'有器械可以用',value:'gym'},
     {id:'home',label:'家里有哑铃/弹力带',sub:'在家练，有一点器材',value:'home'},
     {id:'body',label:'家里徒手',sub:'什么器材都没有，一张垫子就够',value:'body'},
     {id:'undecided',label:'还没想好',sub:'先按徒手排，之后随时可以重新来一份',value:'body'}],
   set:(A,v)=>{ A.place=v },
   react:(v,A,opt)=> opt && opt.id==='undecided' ? '好，先按徒手排。想换成有器材的，点最下面的「重新开始」就行。' : null },
  // 6 重點部位：細分成 14 個部位，分三組；最多選 3 個（每個訓練日加練 2 個動作，部位太多就不集中了）
  {k:'focus', type:'multi', rows:true, max:3,
   q:'有没有特别想重点练的地方？最多选 3 个，这样加练更集中。',
   opts:()=>[
     {header:'上半身'},
     {label:'胸部',sub:'想让胸部更挺、更有线条',value:'chest'},
     {label:'肩部',sub:'想让肩线更圆润、更有力',value:'shoulder'},
     {label:'背部线条',sub:'想让背部更紧致、更有线条',value:'lats'},
     {label:'背部体态',sub:'想让肩背更挺，改善圆肩、驼背',value:'posture'},
     {label:'手臂后侧',sub:'想让手臂后侧（俗称蝴蝶袖）更紧致',value:'triceps'},
     {label:'手臂前侧',sub:'想让手臂更有线条',value:'biceps'},
     {header:'腰腹'},
     {label:'腹部',sub:'想让腹部更平坦、更有力',value:'abs'},
     {label:'腰线（腹斜肌）',sub:'想练出腰线',value:'obliques'},
     {header:'臀腿'},
     {label:'臀部',sub:'想要更翘、更紧实的臀部',value:'glutes'},
     {label:'臀部外侧、髋两侧',sub:'想让臀形更圆润、髋部更稳',value:'abduct'},
     {label:'大腿前侧',value:'quads'},
     {label:'大腿后侧',sub:'靠近臀部、坐下时贴着椅面的那一块',value:'hams'},
     {label:'大腿内侧',sub:'这类动作是我按类型归类的',value:'inner'},
     {label:'小腿',sub:'想让小腿线条更紧致',value:'calves'},
     {header:' '},
     {label:'没有特别想要的',sub:'整体均衡就好',value:'none'}],
   set:(A,v)=>{ A.focus=v },
   react:(v)=> !has2(v,'none') ? '好，每个训练日我会加一小段「重点加练」，重点放在：'+v.map(x=>FOCUS_LABEL[x]).join('、')+'。' : null },
  // 7 不適：用「會不會」的情境問，不問術語
  {k:'injury', type:'multi', rows:true,
   q:'平时身体有没有这些情况？有的话，我会避开容易加重的动作。（可多选）',
   opts:()=>[
     {label:'爬楼梯、下蹲时，膝盖会不舒服',value:'k'},
     {label:'久坐、弯腰后，腰会酸痛',value:'b'},
     {label:'肩颈常常僵硬，抬手臂会痛',value:'s'},
     {label:'都没有',value:'none'}],
   set:(A,v)=>{ A.injury=v },
   react:(v)=> !has2(v,'none') ? '收到，这些部位我会避开压力大的动作。' : null },
  // 8 健康狀況
  {k:'health', type:'multi', rows:true,
   q:'下面这些情况有没有？有的话我会更保守。',
   opts:()=>[
     {label:'怀孕或哺乳期',sub:'只给维持体重的参考，不做热量缺口',value:'preg'},
     {label:'有慢性病，或正在吃药',sub:'同样更保守，并建议先问过医生',value:'chronic'},
     {label:'都没有',value:'none'}],
   set:(A,v)=>{ A.health=v },
   react:(v)=> !has2(v,'none') ? '好，我会更保守：只给维持体重的参考，不做热量缺口。开始训练前也请先问过医生。' : null },
  // 9 忌口
  {k:'diet', type:'multi', rows:true,
   q:'吃的方面，有没有不吃或不能吃的？（可多选）',
   opts:()=>[
     {label:'吃蛋奶素',sub:'不吃肉和海鲜，蛋和奶可以',value:'veg'},
     {label:'不吃牛羊肉',value:'nobeef'},
     {label:'不吃猪肉',value:'nopork'},
     {label:'喝牛奶会不舒服（乳糖不耐）',value:'lactose'},
     {label:'不吃海鲜，或海鲜过敏',value:'seafood'},
     {label:'没有忌口',value:'none'}],
   set:(A,v)=>{ A.diet=v },
   react:(v)=> !has2(v,'none') ? '收到，菜单会避开这些。' : null },
  // 10 吃飯方式
  {k:'eat', type:'pick',
   q:'你平时吃饭，更多是怎么解决的？',
   opts:()=>[
     {label:'外食为主',sub:'食堂、外卖、餐厅',value:'out'},
     {label:'自己做饭',sub:'食材自己买，自己做',value:'cook'},
     {label:'两种都有',sub:'有时自己做，有时在外面吃',value:'mix'}],
   set:(A,v)=>{ A.eat=v }}
];
const INTRO_HINT = '一共 '+STEPS.length+' 个小问题，选错了可以点「改上一题」。所有数据只在你的手机上计算，不会上传。';
</script>
<script>
/* ==== src/js/app.js ==== */
/* 聊天介面與問答流程（唯一碰 DOM 的檔案）。最後一個載入。
   頁面開頭的內嵌小段程式（dev.html / index.html）已先註冊錯誤提示條（#err）與 FIT_LOAD_FAILED；
   開發版 dev.html 若前面任一檔案載入失敗就不啟動（正式版 index.html 是單檔，不會有這種情況）。 */

const $ = s => document.querySelector(s);
const chat = $('#chat'), tray = $('#tray');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const STORE_KEY = 'fit_A';
const PROG_TOTAL = STEPS.length;   // 題數（見 questions.js）
let answered = 0;
function setProg(n){
  answered = n;
  const i = document.querySelector('#prog i');
  if(i) i.style.width = Math.min(100, Math.round(n/PROG_TOTAL*100)) + '%';
}
let A = {};
let runId = 0;

/* ---------- localStorage：一律包 try/catch（部分環境會丟 SecurityError） ---------- */
function loadSaved(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'null') }catch(e){ return null } }
function saveA(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(A)) }catch(e){} }
function clearSaved(){ try{ localStorage.removeItem(STORE_KEY) }catch(e){} }

/* ---------- 聊天泡泡 ---------- */
function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e}
function toBottom(){ setTimeout(()=>{ const h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight); window.scrollTo(0,h); },30) }
function add(who, html, wide){
  // wide：整張卡片佔滿寬度，同一列加 has-wide 以隱藏頭像（取代原本的 :has()，老版微信不支援）
  const row = el('div','row '+who+(wide?' has-wide':''));
  row.appendChild(el('div','bub'+(wide?' wide':''), html));
  chat.insertBefore(row, tray); toBottom(); return row;
}
async function say(html, wide){
  const t = add('bot','<span class="typing"><span></span><span></span><span></span></span>');
  await sleep(wide?500:350+Math.min(html.length*9,800));
  t.remove(); add('bot',html,wide);
}
function clearTray(){tray.innerHTML=''}

/* ---------- 回答元件（都放在聊天流最後的 #tray，隨頁面自然捲動） ----------
   選項文字、說明都是本頁常數（questions.js），不接受使用者輸入（innerHTML 安全）。
   opts[i]：{label, value, sub?（一行說明）, rec?（顯示「建議」）, id?, cls?}；
   o.back 為 true 時多一個「改上一題」；o.rows 為 true 或任一選項有 sub 時，用整列可點的版面。 */
const BACK = {};   // 使用者按「改上一題」時回傳的標記
let lastOpt = null;   // 最近一次點選的選項（讓 react 能依選項回應，例如兩個選項的 value 相同時）
function backBtn(box,res){
  const b = el('button','chip ghost back','← 改上一题');
  b.onclick = ()=>{ clearTray(); res(BACK) };
  box.appendChild(b);
}
const recTag = x => x.rec ? '<span class="rec">建议</span>' : '';
const optHtml = (x,rows) => rows ? '<b>'+x.label+recTag(x)+'</b>'+(x.sub?'<small>'+x.sub+'</small>':'') : x.label+recTag(x);
// 单选
function pick(q, opts, o){
  o = o||{};
  return new Promise(async res=>{
    if(q) await say(q);
    clearTray();
    const rows = !!o.rows || opts.some(x=>x.sub);
    const box = el('div', rows?'opts':'chips');
    opts.forEach(x=>{
      const b = el('button','chip'+(rows?' opt':'')+(x.cls?' '+x.cls:''), optHtml(x,rows));
      b.onclick = ()=>{ lastOpt = x; add('user',x.label); clearTray(); res(x.value) };
      box.appendChild(b);
    });
    if(o.back) backBtn(box,res);
    tray.appendChild(box); toBottom();
  });
}
// 多选；exclusive 表示与其他互斥的选项（如“没有”）。选项里 {header:'上半身'} 是分组标题（不能点）；
// o.max：最多选几个，超过时自动取消最早选的那个。
function multi(q, opts, exclusive, o){
  o = o||{};
  return new Promise(async res=>{
    await say(q); clearTray();
    const real = opts.filter(x=>!x.header);
    const rows = !!o.rows || real.some(x=>x.sub);
    const box = el('div', rows?'opts':'chips'); const sel = new Set(); const btns = [];
    opts.forEach(x=>{
      if(x.header){ if(rows) box.appendChild(el('div','ogrp',x.header)); return }
      const b = el('button','chip'+(rows?' opt':''),optHtml(x,rows));
      b.onclick = ()=>{
        if(sel.has(x.value)){sel.delete(x.value)}
        else{
          if(x.value===exclusive){sel.clear()} else {sel.delete(exclusive)}
          sel.add(x.value);
          if(o.max && x.value!==exclusive && sel.size>o.max) sel.delete(sel.values().next().value);
        }
        btns.forEach((y,i)=>y.classList.toggle('on', sel.has(real[i].value)));
      };
      btns.push(b); box.appendChild(b);
    });
    const ok = el('button','chip go','确定');
    ok.onclick = ()=>{
      if(!sel.size){ sel.add(exclusive) }
      const labels = real.filter(x=>sel.has(x.value)).map(x=>x.label).join('、');
      add('user',labels); clearTray(); res([...sel]);
    };
    box.appendChild(ok);
    if(o.back) backBtn(box,res);
    tray.appendChild(box); toBottom();
  });
}
// 身体数据卡：几行「− ＋」数字，一次填完。不用 <input>（微信里不显示），也不弹键盘。
// 起始数字只是示例：必填项要点过 − ＋ 或点一下数字才算确认，没确认前「确定」按钮是灰的并写明还差几项，
// 避免不小心拿示例数字去算计划。选填项（腰围）默认「未填」，点数字可在「未填」和「已填」间切换。
function nums(q, fields, o){
  o = o||{};
  return new Promise(async res=>{
    await say(q); clearTray();
    const wrap = el('div','nbox'); const S = {}, refresh = [];
    const fmt = (f,x)=> (String(f.s1).indexOf('.')>=0) ? (Math.round(x*10)/10).toFixed(1) : String(Math.round(x));
    const ok = el('button','chip go','确定');
    const syncOk = ()=>{
      const left = fields.filter(f=>!f.optional && !S[f.k].touched);
      if(left.length){ ok.textContent='还差 '+left.length+' 项没确认：'+left.map(f=>f.label).join('、'); ok.className='chip ok0'; ok.disabled=true }
      else { ok.textContent='确定'; ok.className='chip go'; ok.disabled=false }
    };
    fields.forEach(f=>{
      const s = S[f.k] = {v:f.def, touched:false, on:!f.optional};
      const row = el('div','nrow');
      row.appendChild(el('div','nlab',f.label+(f.optional?'<small>选填</small>':'')));
      const val = el('button','nval','');
      const sync = ()=>{
        val.textContent = (f.optional && !s.on) ? '未填' : fmt(f,s.v)+' '+f.unit;
        val.className = 'nval'+(s.touched && s.on ? ' on' : '');
        val.style.setProperty('--off', (-s.v*8)+'px');
        syncOk();
      };
      const mk = (label,d)=>{
        const b = el('button','chip nbtn',label);
        b.onclick = ()=>{ s.v = Math.min(f.max, Math.max(f.min, Math.round((s.v+d)*10)/10)); s.touched = true; s.on = true; sync() };
        return b;
      };
      val.onclick = ()=>{
        if(f.optional){ s.on = !s.on; s.touched = s.on }   // 选填：点数字 = 在「未填」与「已填」之间切换
        else { s.touched = true }
        sync();
      };
      row.appendChild(mk('−'+f.s2,-f.s2)); row.appendChild(mk('−'+f.s1,-f.s1));
      row.appendChild(val);
      row.appendChild(mk('+'+f.s1,f.s1)); row.appendChild(mk('+'+f.s2,f.s2));
      wrap.appendChild(row); refresh.push(sync);
    });
    refresh.forEach(fn=>fn());
    const act = el('div','sact');
    ok.onclick = ()=>{
      const out = {}; const parts = [];
      fields.forEach(f=>{
        const s = S[f.k];
        if(f.optional && !s.on){ out[f.k] = null; return }
        out[f.k] = s.v; parts.push((f.optional?f.label+' ':'')+fmt(f,s.v)+' '+f.unit);
      });
      add('user', parts.join(' · ')); clearTray(); res(out);
    };
    act.appendChild(ok);
    if(o.back) backBtn(act,res);
    wrap.appendChild(act);
    tray.appendChild(wrap); toBottom();
  });
}

function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(t) } }catch(e){}
  const ta=el('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity=0; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy')}catch(e){} ta.remove(); return Promise.resolve();
}

/* ================= 对话流程 ================= */
async function showResult(my){
  setProg(PROG_TOTAL);
  const C = calc(A);
  await say(summaryCard(A,C),true);
  while(true){
    if(my!==runId) return;
    const c = await pick('想先看哪一部分？',[
      {label:'训练计划',value:'w'},{label:'饮食计划',value:'m'},{label:'动作库',value:'x'},{label:'食物库',value:'f'},{label:'小贴士',value:'t'},
      {label:'复制训练摘要',value:'c',cls:'ghost'},{label:'重新开始',value:'r',cls:'ghost'}]);
    if(my!==runId) return;
    if(c==='w') await say(workoutCard(A),true);
    else if(c==='m') await say(menuCard(A,C),true);
    else if(c==='f') await say(foodLibCard(A),true);
    else if(c==='x'){
      const sc = await pick('看哪一类动作？',[{label:'徒手动作',value:0},{label:'哑铃/弹力带',value:1},{label:'健身房器械',value:2},{label:'热身与拉伸',value:'st'},{label:'女性常练',value:'w'}]);
      await say(exLibCard(sc,A),true);
    }
    else if(c==='t') await say(tipsCard(A,C),true);
    else if(c==='c'){ await copyText(planText(A,C)); await say('已复制，可以直接粘贴发给朋友或存到备忘录。'); }
    else if(c==='r'){ clearSaved(); start(); return }
  }
}
/* 問卷內容（問什麼、選項、回應）在 questions.js；這裡只負責畫出來。
   「改上一題」：把這一題與上一題在聊天裡留下的泡泡一起移除，重新問上一題。 */
function askStep(st,bk){
  const q = typeof st.q==='function' ? st.q(A) : st.q;
  if(st.type==='nums') return nums(q, st.fields, {back:bk});
  const opts = st.opts(A);
  if(st.type==='multi') return multi(q, opts, 'none', {back:bk, rows:st.rows, max:st.max});
  return pick(q, opts, {back:bk, rows:st.rows});
}
const rowCount = () => chat.querySelectorAll('.row').length;
const dropRowsFrom = n => [].slice.call(chat.querySelectorAll('.row')).slice(n).forEach(r=>r.remove());

async function flow(my){
  chat.querySelectorAll('.row').forEach(r=>r.remove()); clearTray(); A={}; setProg(0);
  let saved=loadSaved();
  if(saved && !validSaved(saved)) saved=null;   // 存檔格式不對就當作沒有，重新問
  await say('你好呀，我是健身小助手。回答几个小问题，我就能按你的身体情况，排出训练和饮食计划。');
  if(saved){
    const r = await pick('看到你上次已经做过一份计划，要继续用吗？',[{label:'继续上次的',value:'y'},{label:'重新来一份',value:'n'}]);
    if(r==='y'){ A=saved; return showResult(my) }
  }
  await say(INTRO_HINT);
  const marks=[];
  let i=0;
  while(i<STEPS.length){
    if(my!==runId) return;
    const st=STEPS[i]; marks[i]=rowCount(); setProg(i);
    lastOpt = null;
    const v = await askStep(st, i>0);
    if(my!==runId) return;
    if(v===BACK){ dropRowsFrom(marks[i]); i--; dropRowsFrom(marks[i]); continue }
    st.set(A,v);
    const t = st.react ? st.react(v,A,lastOpt) : null;
    if(t) await say(t);
    i++;
  }
  saveA();
  await say('好的：目标'+GOAL[A.goal]+'，'+A.age+' 岁、'+A.height+' cm、'+A.weight+' kg，每周练 '+A.days+' 次，每次约 '+A.mins+' 分钟。我来算一下……');
  await showResult(my);
}
function start(){ runId++; flow(runId) }

// 「换一个」：事件委派；换完重画所在的那张训练卡
chat.addEventListener('click',function(ev){
  const b = ev.target.closest ? ev.target.closest('.swp') : null; if(!b) return;
  const key=b.getAttribute('data-k').split('-');
  if(!applySwap(A,+key[0],+key[1])) return;
  saveA();
  b.closest('.bub').innerHTML=workoutCard(A);
});

if(!FIT_LOAD_FAILED.length) start();
</script>
</body>
